<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Quản Lý Công Việc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101B33;
    --surface:#16223F;
    --surface-2:#1D2C4F;
    --line:#2C3B60;
    --paper:#F4F1E9;
    --gold:#E9B44C;
    --gold-dim:#C99A3C;
    --clay:#D97A5F;
    --text:#F2EFE9;
    --muted:#8CA0C6;
    --danger:#E4685D;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    height:100%;
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:grid;
    grid-template-columns:260px 1fr;
    height:100vh;
    min-height:600px;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    background:var(--surface);
    border-right:1px solid var(--line);
    padding:28px 22px;
    display:flex;
    flex-direction:column;
    gap:26px;
    overflow-y:auto;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand .mark{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    color:var(--gold);
  }
  .brand .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .new-btn{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--gold);
    color:var(--ink);
    border:none;
    border-radius:999px;
    padding:12px 18px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    transition:transform .12s ease, background .12s ease;
  }
  .new-btn:hover{background:var(--gold-dim); transform:translateY(-1px);}
  .new-btn:active{transform:translateY(0);}
  .new-btn svg{width:16px;height:16px;}

  .mini-cal{
    font-family:'IBM Plex Mono',monospace;
  }
  .mini-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-size:12px;
    letter-spacing:.05em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .mini-nav-btn{
    background:none;border:none;color:var(--muted);cursor:pointer;
    font-size:13px;padding:2px 6px;border-radius:4px;
  }
  .mini-nav-btn:hover{color:var(--text); background:var(--surface-2);}
  .mini-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:3px;
    font-size:11px;
  }
  .mini-grid .dow{color:var(--muted); text-align:center; padding-bottom:4px; font-size:10px;}
  .mini-grid .cell{
    text-align:center;
    padding:5px 0;
    border-radius:5px;
    cursor:pointer;
    color:var(--text);
  }
  .mini-grid .cell.other{color:#48577f;}
  .mini-grid .cell:hover{background:var(--surface-2);}
  .mini-grid .cell.today{background:var(--clay); color:var(--ink); font-weight:700;}
  .mini-grid .cell.selected{outline:1px solid var(--gold);}

  .legend{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding-top:6px;
    border-top:1px solid var(--line);
  }
  .legend-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--text);
  }
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}

  /* ---------- MAIN ---------- */
  .main{
    display:flex;
    flex-direction:column;
    min-width:0;
    background:var(--ink);
  }
  .toolbar{
    display:flex;
    align-items:center;
    gap:16px;
    padding:22px 32px;
    border-bottom:1px solid var(--line);
  }
  .toolbar .today-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 16px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .toolbar .today-btn:hover{border-color:var(--gold); color:var(--gold);}
  .nav-arrows{display:flex; gap:4px;}
  .nav-arrows button{
    background:none;border:none;color:var(--muted);
    width:32px;height:32px;border-radius:50%;
    cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;
  }
  .nav-arrows button:hover{background:var(--surface-2); color:var(--text);}
  .toolbar h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-style:italic;
    font-size:26px;
    margin:0;
    flex:1;
    color:var(--text);
  }
  .stamp{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--gold);
    border:1px solid var(--gold-dim);
    padding:5px 10px;
    border-radius:999px;
    letter-spacing:.05em;
    transform:rotate(-2deg);
  }

  .grid-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:0 24px 24px;
    overflow:hidden;
  }
  .dow-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    padding:10px 4px 6px;
  }
  .dow-row span{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .month-grid{
    flex:1;
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-auto-rows:1fr;
    gap:6px;
    min-height:0;
  }
  .day-cell{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:8px 8px 6px;
    display:flex;
    flex-direction:column;
    gap:5px;
    cursor:pointer;
    min-height:0;
    overflow:hidden;
    position:relative;
    transition:border-color .12s ease;
  }
  .day-cell:hover{border-color:var(--gold-dim);}
  .day-cell.other-month{background:transparent; opacity:.38;}
  .day-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--muted);
    align-self:flex-start;
  }
  .day-cell.today .day-num{
    background:var(--clay);
    color:var(--ink);
    font-weight:700;
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
  }
  .events{
    display:flex;
    flex-direction:column;
    gap:3px;
    overflow:hidden;
  }
  .event-chip{
    font-size:11.5px;
    padding:3px 7px;
    border-radius:6px;
    background:var(--surface-2);
    color:var(--text);
    border-left:3px solid var(--gold);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .more-chip{
    font-size:11px;
    color:var(--muted);
    padding:2px 7px;
    font-family:'IBM Plex Mono',monospace;
  }

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(6,10,22,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    backdrop-filter:blur(2px);
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    width:380px;
    max-width:90vw;
    padding:26px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    margin:0 0 18px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--muted);
    margin-bottom:6px;
    font-family:'IBM Plex Mono',monospace;
  }
  .field input, .field select, .field textarea{
    width:100%;
    background:var(--ink);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
    font-family:'Inter',sans-serif;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;
    border-color:var(--gold);
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .swatches{display:flex; gap:8px; margin-top:4px;}
  .swatch{
    width:24px;height:24px;border-radius:50%;
    cursor:pointer; border:2px solid transparent;
  }
  .swatch.selected{border-color:var(--text);}
  .modal-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
  }
  .btn{
    border:none;
    border-radius:999px;
    padding:10px 18px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .btn-primary{background:var(--gold); color:var(--ink);}
  .btn-primary:hover{background:var(--gold-dim);}
  .btn-ghost{background:none; color:var(--muted); border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--text); border-color:var(--muted);}
  .btn-danger{background:none; color:var(--danger); border:none; font-size:13px; cursor:pointer;}
  .btn-danger:hover{text-decoration:underline;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  @media(max-width:800px){
    .app{grid-template-columns:1fr;}
    .sidebar{display:none;}
  }
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <span class="mark">Lịch</span>
      <span class="sub">V.2026</span>
    </div>

    <button class="new-btn" id="newEventBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Sự kiện mới
    </button>

    <div class="mini-cal">
      <div class="mini-head">
        <button class="mini-nav-btn" id="miniPrev">‹</button>
        <span id="miniLabel">—</span>
        <button class="mini-nav-btn" id="miniNext">›</button>
      </div>
      <div class="mini-grid" id="miniGrid"></div>
    </div>

    <div class="legend">
      <div class="legend-title">Loại sự kiện</div>
      <div class="legend-item"><span class="dot" style="background:#E9B44C"></span>Công việc</div>
      <div class="legend-item"><span class="dot" style="background:#D97A5F"></span>Cá nhân</div>
      <div class="legend-item"><span class="dot" style="background:#6FA8DC"></span>Cuộc họp</div>
      <div class="legend-item"><span class="dot" style="background:#8CD98C"></span>Nhắc nhở</div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="toolbar">
      <button class="today-btn" id="todayBtn">Hôm nay</button>
      <div class="nav-arrows">
        <button id="prevMonth">‹</button>
        <button id="nextMonth">›</button>
      </div>
      <h1 id="monthLabel">—</h1>
      <div class="stamp" id="eventCountStamp">0 sự kiện</div>
    </div>

    <div class="grid-wrap">
      <div class="dow-row">
        <span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span>
      </div>
      <div class="month-grid" id="monthGrid"></div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Sự kiện mới</h2>
    <input type="hidden" id="eventId">
    <div class="field">
      <label>Tiêu đề</label>
      <input type="text" id="eventTitle" placeholder="VD: Họp nhóm dự án">
    </div>
    <div class="row2">
      <div class="field">
        <label>Ngày</label>
        <input type="date" id="eventDate">
      </div>
      <div class="field">
        <label>Giờ</label>
        <input type="time" id="eventTime">
      </div>
    </div>
    <div class="field">
      <label>Ghi chú</label>
      <textarea id="eventNote" rows="2" placeholder="Không bắt buộc"></textarea>
    </div>
    <div class="field">
      <label>Màu</label>
      <div class="swatches" id="swatches">
        <div class="swatch selected" data-color="#E9B44C" style="background:#E9B44C"></div>
        <div class="swatch" data-color="#D97A5F" style="background:#D97A5F"></div>
        <div class="swatch" data-color="#6FA8DC" style="background:#6FA8DC"></div>
        <div class="swatch" data-color="#8CD98C" style="background:#8CD98C"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-danger" id="deleteBtn" style="display:none;">Xóa sự kiện</button>
      <div style="display:flex; gap:10px; margin-left:auto;">
        <button class="btn btn-ghost" id="cancelBtn">Hủy</button>
        <button class="btn btn-primary" id="saveBtn">Lưu</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'so-lich-events-v1';
  const DOW = ['T2','T3','T4','T5','T6','T7','CN'];
  const MONTH_NAMES = ['Tháng Một','Tháng Hai','Tháng Ba','Tháng Tư','Tháng Năm','Tháng Sáu',
    'Tháng Bảy','Tháng Tám','Tháng Chín','Tháng Mười','Tháng Mười Một','Tháng Mười Hai'];

  let events = loadEvents();
  let viewDate = new Date();          // month currently shown
  let miniDate = new Date(viewDate);  // month shown in mini-calendar
  let selectedDate = todayStr();

  function loadEvents(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : seedEvents();
    }catch(e){ return seedEvents(); }
  }
  function saveEvents(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
  }
  function seedEvents(){
    const t = new Date();
    const fmt = (d)=> d.toISOString().slice(0,10);
    const sample = [
      {id: uid(), title:'Họp khởi động dự án', date: fmt(t), time:'09:00', note:'Phòng họp A', color:'#6FA8DC'},
      {id: uid(), title:'Deadline báo cáo', date: fmt(new Date(t.getFullYear(),t.getMonth(),t.getDate()+3)), time:'17:00', note:'', color:'#E9B44C'},
      {id: uid(), title:'Sinh nhật bạn thân', date: fmt(new Date(t.getFullYear(),t.getMonth(),t.getDate()+6)), time:'', note:'Mua quà', color:'#D97A5F'},
    ];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sample));
    return sample;
  }
  function uid(){ return 'e' + Math.random().toString(36).slice(2,10); }
  function todayStr(){ return dateToStr(new Date()); }
  function dateToStr(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function eventsOn(dstr){
    return events.filter(e => e.date === dstr).sort((a,b)=> (a.time||'99:99').localeCompare(b.time||'99:99'));
  }

  // ---------- MAIN MONTH GRID ----------
  function renderMonth(){
    const y = viewDate.getFullYear(), m = viewDate.getMonth();
    document.getElementById('monthLabel').textContent = MONTH_NAMES[m] + ' ' + y;

    const first = new Date(y, m, 1);
    const startOffset = (first.getDay() + 6) % 7; // Monday=0
    const startDate = new Date(y, m, 1 - startOffset);

    const grid = document.getElementById('monthGrid');
    grid.innerHTML = '';
    let totalCount = 0;

    for(let i=0;i<42;i++){
      const cellDate = new Date(startDate);
      cellDate.setDate(startDate.getDate()+i);
      const dstr = dateToStr(cellDate);
      const isOther = cellDate.getMonth() !== m;
      const isToday = dstr === todayStr();

      const cell = document.createElement('div');
      cell.className = 'day-cell' + (isOther ? ' other-month':'') + (isToday ? ' today':'');
      cell.innerHTML = `<div class="day-num">${cellDate.getDate()}</div><div class="events"></div>`;
      cell.addEventListener('click', ()=> openModal(null, dstr));

      const dayEvents = eventsOn(dstr);
      totalCount += isOther ? 0 : dayEvents.length;
      const evWrap = cell.querySelector('.events');
      const maxShow = 3;
      dayEvents.slice(0,maxShow).forEach(ev=>{
        const chip = document.createElement('div');
        chip.className = 'event-chip';
        chip.style.borderLeftColor = ev.color;
        chip.textContent = (ev.time ? ev.time+' · ' : '') + ev.title;
        chip.addEventListener('click', (e)=>{ e.stopPropagation(); openModal(ev); });
        evWrap.appendChild(chip);
      });
      if(dayEvents.length > maxShow){
        const more = document.createElement('div');
        more.className = 'more-chip';
        more.textContent = `+${dayEvents.length - maxShow} khác`;
        more.addEventListener('click', (e)=>{ e.stopPropagation(); openModal(null, dstr); });
        evWrap.appendChild(more);
      }

      grid.appendChild(cell);
    }
    document.getElementById('eventCountStamp').textContent = totalCount + ' sự kiện tháng này';
    renderMini();
  }

  // ---------- MINI CALENDAR ----------
  function renderMini(){
    const y = miniDate.getFullYear(), m = miniDate.getMonth();
    document.getElementById('miniLabel').textContent = MONTH_NAMES[m].replace('Tháng ','Th.') + ' ' + y;
    const grid = document.getElementById('miniGrid');
    grid.innerHTML = '';
    DOW.forEach(d=>{
      const el = document.createElement('div');
      el.className='dow'; el.textContent=d;
      grid.appendChild(el);
    });
    const first = new Date(y,m,1);
    const startOffset = (first.getDay()+6)%7;
    const startDate = new Date(y,m,1-startOffset);
    for(let i=0;i<42;i++){
      const cellDate = new Date(startDate);
      cellDate.setDate(startDate.getDate()+i);
      const dstr = dateToStr(cellDate);
      const el = document.createElement('div');
      el.className = 'cell' + (cellDate.getMonth()!==m?' other':'') + (dstr===todayStr()?' today':'') + (dstr===selectedDate?' selected':'');
      el.textContent = cellDate.getDate();
      el.addEventListener('click', ()=>{
        selectedDate = dstr;
        viewDate = new Date(cellDate.getFullYear(), cellDate.getMonth(), 1);
        miniDate = new Date(viewDate);
        renderMonth();
      });
      grid.appendChild(el);
    }
  }

  // ---------- MODAL ----------
  const overlay = document.getElementById('overlay');
  const form = {
    id: document.getElementById('eventId'),
    title: document.getElementById('eventTitle'),
    date: document.getElementById('eventDate'),
    time: document.getElementById('eventTime'),
    note: document.getElementById('eventNote'),
  };
  let selectedColor = '#E9B44C';

  function openModal(ev, dateStr){
    document.getElementById('modalTitle').textContent = ev ? 'Sửa sự kiện' : 'Sự kiện mới';
    document.getElementById('deleteBtn').style.display = ev ? 'inline-block' : 'none';
    form.id.value = ev ? ev.id : '';
    form.title.value = ev ? ev.title : '';
    form.date.value = ev ? ev.date : (dateStr || selectedDate);
    form.time.value = ev ? ev.time : '';
    form.note.value = ev ? ev.note : '';
    selectedColor = ev ? ev.color : '#E9B44C';
    document.querySelectorAll('.swatch').forEach(s=>{
      s.classList.toggle('selected', s.dataset.color === selectedColor);
    });
    overlay.classList.add('open');
    setTimeout(()=>form.title.focus(), 50);
  }
  function closeModal(){ overlay.classList.remove('open'); }

  document.getElementById('swatches').addEventListener('click', (e)=>{
    if(!e.target.classList.contains('swatch')) return;
    selectedColor = e.target.dataset.color;
    document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected'));
    e.target.classList.add('selected');
  });

  document.getElementById('newEventBtn').addEventListener('click', ()=> openModal(null, selectedDate));
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });

  document.getElementById('saveBtn').addEventListener('click', ()=>{
    const title = form.title.value.trim();
    if(!title){ form.title.focus(); return; }
    const date = form.date.value || selectedDate;
    const id = form.id.value;
    if(id){
      const ev = events.find(e=>e.id===id);
      if(ev){
        ev.title = title; ev.date = date; ev.time = form.time.value;
        ev.note = form.note.value; ev.color = selectedColor;
      }
    } else {
      events.push({ id: uid(), title, date, time: form.time.value, note: form.note.value, color: selectedColor });
    }
    saveEvents();
    selectedDate = date;
    closeModal();
    renderMonth();
  });

  document.getElementById('deleteBtn').addEventListener('click', ()=>{
    const id = form.id.value;
    events = events.filter(e=>e.id!==id);
    saveEvents();
    closeModal();
    renderMonth();
  });

  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape') closeModal();
  });

  // ---------- NAV ----------
  document.getElementById('prevMonth').addEventListener('click', ()=>{
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1);
    miniDate = new Date(viewDate);
    renderMonth();
  });
  document.getElementById('nextMonth').addEventListener('click', ()=>{
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 1);
    miniDate = new Date(viewDate);
    renderMonth();
  });
  document.getElementById('todayBtn').addEventListener('click', ()=>{
    viewDate = new Date();
    miniDate = new Date();
    selectedDate = todayStr();
    renderMonth();
  });
  document.getElementById('miniPrev').addEventListener('click', ()=>{
    miniDate = new Date(miniDate.getFullYear(), miniDate.getMonth()-1, 1);
    renderMini();
  });
  document.getElementById('miniNext').addEventListener('click', ()=>{
    miniDate = new Date(miniDate.getFullYear(), miniDate.getMonth()+1, 1);
    renderMini();
  });

  renderMonth();
})();
</script>
</body>
</html>
